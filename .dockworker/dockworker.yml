dockworker:
  version: '6'
  application:
    name: Solr Instance for unbscholar Applications at UNB Libraries
    uri: https://unbscholar.solr.lib.unb.ca
    description: >
      A Solr instance for use with unbscholar applications at UNB Libraries.
    topics:
      - solr
      - unbscholar
    identifiers:
      id: unbscholar.solr.lib.unb.ca
      slug: unbscholar-solr-lib-unb-ca
      short_slug: scholarsolr
      uuid: 3508
    framework:
      name: Solr
      version: 7
      startup_finished_marker: 'o.e.j.s.Server Started'
      endpoint:
        name: http
        port: 8983
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - dev
      - prod
    deployments:
      unbscholar-solr-lib-unb-ca:
        default: true
        managed: true
        name: unbscholar-solr-lib-unb-ca
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: unbscholar.solr.lib.unb.ca
    jira:
      project_keys:
        - SCHOLAR
    image:
      name: ghcr.io/unb-libraries/unbscholar.solr.lib.unb.ca
      parent: solr:9.8
      repository: GitHub
      push-branches:
        - dev
        - prod
        - 9.x